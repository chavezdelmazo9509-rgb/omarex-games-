<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi mini generador</title>
<style>
body{
	background: #0d0d1a;
	color: white;
	font-family: sans-serif;
	text-align: center;
	padding: 40px;
}
h1{
	color:  #39ff14;
}
 input {
	padding:12px;
	font-size: 18px;
	border-radius: 8px;
	border: 2px solid #ff2ec4;
}
button{
	background: #39ff14;
	border: none;
	padding: 12px 24px;
	font-size: 18px;
	border-radius: 10px;
	cursor: pointer;
}
button:hover{
	background: #ff2ec4;
	color:white;
}
#resultado{
	font-size: 24px;
	color: #ffd23f;
}
</style>
</head>
<body>
<h1>🎮 Mi Mini Generador</h1>
<input type="text" id="nombre" placeholder="Escribe un juego">
<button id="btn-generar">✨ Generar</button>
<p id="resultado"></p>
<script>
	const titulos = [
	"Nadie esperaba esta jugada en {X} 😱",
	"Mi peor momento en {X} 😂",
	"El truco de {X} que nadie te dice 🤫"
];
 console.log(titulos);

 function generar () {
	const nombre = document.getElementById("nombre").value;
 	const numero = Math.floor(Math.random() * titulos.length);
	const titulo = titulos[numero].replaceAll("{X}", nombre);
	document.getElementById("resultado").textContent = titulo;
}
 document.getElementById("btn-generar").onclick = generar;
</script>
</body>
</html>
