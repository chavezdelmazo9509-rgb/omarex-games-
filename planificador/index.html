<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de TikToks — OMAREX</title>
    <!-- Página privada de Omar: que Google no la muestre -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0d0d1a">
    <link rel="icon" type="image/jpeg" href="../omarex.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --fondo: #0d0d1a;
            --panel: #15152b;
            --tarjeta: #1e1e3d;
            --borde: #3a3a6e;
            --texto: #e0e0ff;
            --suave: #a0a0c0;
            --verde: #39ff14;
            --rosa: #ff2ec4;
            --dorado: #ffd23f;
            --rojo: #ff3b5c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Rajdhani', sans-serif;
            color: var(--texto);
            background-color: var(--fondo);
            background-image: radial-gradient(circle at top, #1a1a3a, var(--fondo));
            min-height: 100vh;
            padding: 20px 16px 60px;
        }

        button, input, select, textarea { font-family: inherit; font-size: 16px; }
        button { cursor: pointer; }

        .contenedor { max-width: 1200px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 20px; }
        header img { width: 90px; }
        h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--verde);
            text-shadow: 0 0 10px var(--verde);
            font-size: clamp(22px, 6vw, 34px);
        }
        .subtitulo { color: var(--suave); font-size: 17px; }

        /* Barra de arriba: meta semanal + botones */
        .barra {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            align-items: center;
            background: var(--panel);
            border: 1px solid var(--borde);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 18px;
        }
        .meta-texto { font-weight: 700; font-size: 17px; margin-bottom: 6px; }
        .meta-texto select {
            background: var(--tarjeta); color: var(--texto); border: 1px solid var(--borde);
            border-radius: 6px; padding: 2px 6px; font-weight: 700;
        }
        .meta-barra { height: 10px; background: #26264a; border-radius: 99px; overflow: hidden; }
        #meta-relleno { height: 100%; width: 0; background: linear-gradient(90deg, var(--verde), var(--rosa)); transition: width 0.4s; }

        .botones-barra { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

        .boton {
            font-weight: 700;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            color: #0d0d1a;
            background: var(--verde);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.4);
        }
        .boton:hover { background: var(--rosa); color: #fff; }
        .boton.secundario { background: var(--tarjeta); color: var(--texto); border: 1px solid var(--borde); box-shadow: none; }
        .boton.secundario:hover { border-color: var(--rosa); }

        /* Tablero de 4 columnas */
        .tablero {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            align-items: start;
        }

        .columna {
            background: var(--panel);
            border: 1px solid var(--borde);
            border-top: 4px solid var(--color-col);
            border-radius: 12px;
            padding: 12px;
            min-height: 160px;
        }
        .columna h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            color: var(--color-col);
        }
        .contador {
            background: var(--tarjeta);
            color: var(--texto);
            border-radius: 99px;
            padding: 2px 10px;
            font-size: 13px;
        }
        .vacio { color: var(--suave); font-size: 15px; text-align: center; padding: 18px 6px; }

        .tarjeta {
            background: var(--tarjeta);
            border: 1px solid var(--borde);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }
        .tarjeta-titulo { font-weight: 700; font-size: 17px; line-height: 1.25; margin-bottom: 6px; word-break: break-word; }
        .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
        .etiqueta { font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #2a2a55; }
        .etiqueta.fecha { background: #3a2a10; color: var(--dorado); }
        .etiqueta.fecha.atrasada { background: #4a1020; color: var(--rojo); }
        .tarjeta-notas { color: var(--suave); font-size: 14px; white-space: pre-wrap; margin-bottom: 6px; word-break: break-word; }
        .tarjeta-hashtags { color: var(--rosa); font-size: 14px; margin-bottom: 6px; word-break: break-word; }

        .acciones { display: flex; gap: 6px; justify-content: space-between; }
        .acciones button {
            background: #14142b;
            color: var(--texto);
            border: 1px solid var(--borde);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 15px;
            font-weight: 700;
        }
        .acciones button:hover:not(:disabled) { border-color: var(--verde); }
        .acciones button:disabled { opacity: 0.3; cursor: default; }
        .acciones .avanzar { flex: 1; }

        /* Ventana para crear / editar */
        .fondo-ventana {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center; justify-content: center;
            padding: 16px;
            z-index: 10;
        }
        .fondo-ventana.abierta { display: flex; }
        .ventana {
            background: var(--panel);
            border: 2px solid var(--verde);
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.35);
            border-radius: 14px;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            max-height: 92vh;
            overflow-y: auto;
        }
        .ventana h3 { font-family: 'Orbitron', sans-serif; color: var(--verde); margin-bottom: 14px; }
        .ventana label { display: block; font-weight: 700; margin: 10px 0 4px; }
        .ventana input, .ventana select, .ventana textarea {
            width: 100%;
            background: #0a0a14;
            color: var(--texto);
            border: 1px solid var(--borde);
            border-radius: 8px;
            padding: 10px;
        }
        .ventana input:focus, .ventana select:focus, .ventana textarea:focus { outline: none; border-color: var(--rosa); }
        .ventana textarea { resize: vertical; min-height: 70px; }
        .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .botones-ventana { display: flex; gap: 8px; justify-content: space-between; margin-top: 18px; flex-wrap: wrap; }
        .boton.peligro { background: transparent; color: var(--rojo); border: 1px solid var(--rojo); box-shadow: none; }
        .boton.peligro:hover { background: var(--rojo); color: #fff; }

        .aviso {
            position: fixed; left: 50%; bottom: 20px;
            transform: translateX(-50%) translateY(100px);
            background: var(--verde); color: #0d0d1a;
            font-weight: 700; padding: 10px 18px; border-radius: 10px;
            transition: transform 0.3s; z-index: 20;
        }
        .aviso.visible { transform: translateX(-50%) translateY(0); }

        .nota-guardado { text-align: center; color: var(--suave); font-size: 14px; margin-top: 22px; }

        @media (max-width: 900px) {
            .tablero { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 600px) {
            .tablero { grid-template-columns: 1fr; }
            .barra { grid-template-columns: 1fr; }
            .botones-barra { justify-content: stretch; }
            .botones-barra .boton { flex: 1; }
        }
    </style>
</head>
<body>
<div class="contenedor">
    <header>
        <img src="../omarex-logo.png" alt="OMAREX" width="90" height="90">
        <h1>📋 Planificador de TikToks</h1>
        <p class="subtitulo">Idea → Grabado → Editado → Subido</p>
    </header>

    <div class="barra">
        <div>
            <div class="meta-texto">
                🎯 Meta de la semana: <span id="meta-hechos">0</span> /
                <select id="meta-numero" aria-label="Videos por semana">
                    <option>1</option><option>2</option><option selected>3</option><option>4</option>
                    <option>5</option><option>7</option><option>10</option><option>14</option>
                </select>
                videos subidos <span id="meta-emoji"></span>
            </div>
            <div class="meta-barra"><div id="meta-relleno"></div></div>
        </div>
        <div class="botones-barra">
            <button class="boton" id="btn-nueva">➕ Nueva idea</button>
            <button class="boton secundario" id="btn-azar">🎲 Idea al azar</button>
            <button class="boton secundario" id="btn-exportar">💾 Guardar copia</button>
            <button class="boton secundario" id="btn-importar">📂 Cargar copia</button>
            <input type="file" id="archivo-importar" accept="application/json,.json" hidden>
        </div>
    </div>

    <div class="tablero" id="tablero"></div>

    <p class="nota-guardado">🔒 Tus ideas se guardan solo en este navegador. Usa <strong>💾 Guardar copia</strong> para pasarlas a otro dispositivo.</p>
</div>

<!-- Ventana para crear / editar un video -->
<div class="fondo-ventana" id="fondo-ventana">
    <form class="ventana" id="formulario">
        <h3 id="ventana-titulo">➕ Nueva idea</h3>

        <label for="campo-titulo">Título del video *</label>
        <input id="campo-titulo" maxlength="100" placeholder="Ej: Top 5 momentos épicos de Fortnite" required>

        <div class="fila">
            <div>
                <label for="campo-tipo">Tipo</label>
                <select id="campo-tipo">
                    <option value="juego">🎮 Videojuego</option>
                    <option value="anime">🎌 Anime</option>
                    <option value="pagina">🕹️ Mi página</option>
                    <option value="otro">✨ Otro</option>
                </select>
            </div>
            <div>
                <label for="campo-plataforma">Dónde</label>
                <select id="campo-plataforma">
                    <option value="tiktok">📱 TikTok</option>
                    <option value="youtube">▶️ YouTube</option>
                    <option value="shorts">⚡ Shorts</option>
                    <option value="todas">🌐 Todas</option>
                </select>
            </div>
        </div>

        <label for="campo-fecha">Fecha para subirlo</label>
        <input type="date" id="campo-fecha">

        <label for="campo-notas">Notas (guion, clips que usar, música...)</label>
        <textarea id="campo-notas" maxlength="1000" placeholder="Ej: usar el clip del final, música épica, texto: ¿Me ganas?"></textarea>

        <label for="campo-hashtags">Hashtags</label>
        <input id="campo-hashtags" maxlength="200" placeholder="#fortnite #gaming #OMAREXGames">

        <div class="botones-ventana">
            <button type="button" class="boton peligro" id="btn-borrar">🗑️ Borrar</button>
            <div style="display:flex; gap:8px; margin-left:auto;">
                <button type="button" class="boton secundario" id="btn-cancelar">Cancelar</button>
                <button type="submit" class="boton">Guardar</button>
            </div>
        </div>
    </form>
</div>

<div class="aviso" id="aviso"></div>

<script src="planificador.js"></script>
</body>
</html>
